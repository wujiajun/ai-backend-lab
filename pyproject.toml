[project]
name = "ai-backend-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jason", email = "wujiajun1020@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.24.0",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.2.3",
    "sqlalchemy>=2.1.1",
    "tenacity>=9.1.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-backend-lab = "ai_backend_lab:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "alembic>=1.20.0",
    "black>=26.5.1",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # All errors
    "F",  # All pyflakes codes
    "I",  # Import-related rules
]
ignore = ["E501"]
